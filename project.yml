name: WEON
options:
  bundleIdPrefix: com.sankang
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.9.0
  NMapsMap:
    url: https://github.com/navermaps/SPM-NMapsMap
    from: 3.24.0
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: 4.6.1
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WEON:
    type: application
    platform: iOS
    sources:
      - path: WEON
        excludes:
          - "Resources/GoogleService-Info.plist"
          - "Resources/Lottie"
      # Lottie JSON 은 폴더째 복사해 파일을 넣기만 하면 앱에 포함
      - path: WEON/Resources/Lottie
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sankang.WEON
        PRODUCT_NAME: WEON
        INFOPLIST_FILE: WEON/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WEON/Resources/WEON.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Copy Firebase Configuration
        basedOnDependencyAnalysis: false
        script: |
          SOURCE="${SRCROOT}/WEON/Resources/GoogleService-Info.plist"
          if [ -f "$SOURCE" ]; then
            cp "$SOURCE" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/"
          fi
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseMessaging
      - package: NMapsMap
      - package: Lottie
  WEONTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WEONTests
    dependencies:
      - target: WEON
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sankang.WEONTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WEON.app/WEON"
        BUNDLE_LOADER: "$(TEST_HOST)"
  WEONUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WEONUITests
    dependencies:
      - target: WEON
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.sankang.WEONUITests
        TEST_TARGET_NAME: WEON
schemes:
  WEON:
    build:
      targets:
        WEON: all
        WEONTests: [test]
        WEONUITests: [test]
    test:
      targets:
        - WEONTests
        - WEONUITests
